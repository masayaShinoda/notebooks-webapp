# Install to /etc/nginx/sites-available/notes.example.com
# then:  ln -s ../sites-available/notes.example.com /etc/nginx/sites-enabled/
#
# Substitute the domain and /home/deploy/web/notebooks if yours differ.
#
# The TLS block below references certificate paths that do not exist until
# certbot has run. Install this file with ONLY the port-80 server block
# first, run certbot, then add the rest -- see DEPLOY.md.

upstream notebooks_app {
    server unix:/run/notebooks/gunicorn.sock fail_timeout=0;
}

# Brute-force brake for the sign-in form: 10 attempts a minute per client IP,
# with a small burst so a mistyped password never trips it.
limit_req_zone $binary_remote_addr zone=notebooks_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name notes.example.com;

    # Must stay reachable over plain HTTP for certificate renewal.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name notes.example.com;

    ssl_certificate     /etc/letsencrypt/live/notes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Notes can be long; the autosave POSTs the whole body each time.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Keep this private instance out of search and AI indexes. Django sets
    # X-Frame-Options, X-Content-Type-Options and Referrer-Policy itself --
    # deliberately not repeated here, since that would emit them twice.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    access_log /var/log/nginx/notebooks.access.log;
    error_log  /var/log/nginx/notebooks.error.log;

    # Served straight off disk from STATIC_ROOT -- the app never sees these.
    # Cache hard: {% vstatic %} appends an mtime query string, so a changed
    # file arrives under a new URL.
    location /static/ {
        alias /home/deploy/web/notebooks/staticfiles/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header does not inherit into a block that defines its own, so
        # the robots header has to be repeated here.
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    }

    location = /accounts/login/ {
        limit_req zone=notebooks_login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://notebooks_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        proxy_pass http://notebooks_app;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # CRITICAL. Django's SECURE_PROXY_SSL_HEADER reads this to decide a
        # request arrived over HTTPS. Without it, SECURE_SSL_REDIRECT sends the
        # browser into an infinite redirect loop.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
